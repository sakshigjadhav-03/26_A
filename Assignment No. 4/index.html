
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Employee Registration</h1>
    <p class="subtitle">Enter your details to register</p>

    <form id="employeeForm">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter full name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Minimum 8 characters" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number" required>

        <label>Department</label>
        <select id="department" required>
            <option value="">Choose Department</option>
            <option>IT</option>
            <option>HR</option>
            <option>Finance</option>
            <option>Marketing</option>
            <option>Sales</option>
        </select>

        <label>Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Female</option>
            <option>Male</option>
            <option>Other</option>
            <option>Prefer not to say</option>
        </select>

        <label>Date of Joining</label>
        <input type="date" id="joining" required>

        <button type="submit">Register Employee</button>
        <button type="reset" class="reset">Clear Form</button>

        <p id="message"></p>
    </form>
</div>
<p id="message"></p>
<script src="script.js"></script>
</body>
</html>
